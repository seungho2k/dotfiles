# Fonts
font_family family="RobotoMono Nerd Font Mono" style="Regular"
font_size 12
modify_font cell_width 90%
modify_font cell_height 110%

# Cursor
shell_integration no-cursor
cursor_shape block
cursor_shape_unfocused block
cursor_blink_interval 0

# Window
window_margin_width 0 10
placement_strategy top-left
confirm_os_window_close 0

# Tabs
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+enter no_op
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+shift+enter no_op
tab_bar_style fade
tab_bar_drag_threshold 0
tab_title_template "{index}"
active_tab_font_style none

# macOS
macos_titlebar_color background
macos_show_window_title_in none

# Shift + Enter
map shift+enter send_text all \x1b[13;2u

# Ayu Light colorscheme
cursor                  #ffaa33
cursor_text_color       background
url_color               #399ee6
visual_bell_color       #86b300
bell_border_color       #86b300
active_border_color     #86b300
inactive_border_color   #e7eaed
